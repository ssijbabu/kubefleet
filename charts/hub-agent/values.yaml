# Default values for hub-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/kubefleet-dev/kubefleet/hub-agent
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

logVerbosity: 5

enableWebhook: true
webhookServiceName: fleetwebhook
enableGuardRail: true
webhookClientConnectionType: service
enableWorkload: false
# useCertManager enables cert-manager for webhook certificate management
# When enabled, cert-manager must be installed as a prerequisite (it is not installed automatically by this chart)
# and a Certificate resource will be created
useCertManager: false
# webhookCertSecretName is ONLY used when useCertManager=true
# It specifies the name of the Secret where cert-manager stores the certificate
# Example:
# webhookCertSecretName: fleet-webhook-server-cert

# externalCA makes the hub agent issue its own webhook serving certificates, signed by an external CA
# whose private key stays in a KMS or HSM (e.g. Azure Key Vault, HashiCorp Vault, AWS KMS, GCP KMS).
# It is an alternative to useCertManager, and also allows replicaCount > 1. Set both fields, or neither.
externalCA:
  # certConfigMapName names a ConfigMap (key ca.crt) holding the PEM encoded CA certificate(s).
  # It may hold more than one CA certificate, e.g. the old and the new one during a CA rotation.
  certConfigMapName: ""
  # keyRef is the key reference URI of the CA private key, e.g. azurekms://<vault>.vault.azure.net/<key>.
  # The signing is done by a sigstore KMS plugin program named sigstore-kms-<scheme>, which must be on
  # the PATH of the hub-agent image.
  keyRef: ""
  # servingCertValidity is the lifetime of each webhook serving certificate (minimum 10m). The hub
  # agent renews it after two thirds of its lifetime; the remaining third is the time available to
  # fix a failed renewal (e.g. the KMS being unavailable) before the certificate expires.
  # E.g. 720h (30 days) leaves 10 days, 168h (7 days) about 2.3 days, 24h about 8 hours.
  servingCertValidity: 720h

# podLabels and serviceAccountAnnotations are passed through to the hub-agent pod template and
# ServiceAccount, e.g. the workload identity metadata a KMS plugin needs to authenticate.
podLabels: {}
serviceAccountAnnotations: {}

forceDeleteWaitTime: 15m0s
clusterUnhealthyThreshold: 3m0s
resourceSnapshotCreationMinimumInterval: 30s
resourceChangesCollectionDuration: 15s

namespace: fleet-system

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

tolerations: []

affinity: {}

enableClusterInventoryAPI: true
enableStagedUpdateRunAPIs: true
enableEvictionAPIs: true

enablePprof: true
pprofPort: 6065

hubAPIQPS: 250
hubAPIBurst: 1000
MaxConcurrentClusterPlacement: 100
ConcurrentResourceChangeSyncs: 20
MaxFleetSizeSupported: 100

additionalConfigData: {}
additionalConfigDataMountPath: /etc/kubefleet/additional-config

enableAdmissionPolicyManager: false
admissionPolicyManagerConfigName: ""
